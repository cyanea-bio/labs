name: Release to crates.io

# Publishes the workspace to crates.io using Trusted Publishing (OIDC) — no
# stored crates.io token. Triggered by pushing a version tag (e.g. `v0.1.1`)
# after the workspace version has been bumped. See docs/PUBLISHING.md for the
# one-time crates.io + GitHub setup.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry-run only (no publish)"
        type: boolean
        default: true

# No token is stored; the publish job requests a short-lived one via OIDC.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (HDF5 for cyanea-omics)
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cyanea-core") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match workspace version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --exclude cyanea-py

      # Package + build-verify every publishable member in dependency order,
      # without uploading. `publish = false` crates are skipped automatically.
      - name: Dry-run publish (whole workspace)
        run: cargo publish --workspace --dry-run

  publish:
    name: Publish to crates.io
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A GitHub Environment (create under Settings → Environments) — lets you
    # gate publishing behind a manual approval, and its name must match the
    # Environment configured on each crate's crates.io trusted publisher.
    environment: crates-io
    permissions:
      id-token: write # required for crates.io Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries (HDF5 for cyanea-omics)
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Publishes every publishable member in dependency order, waiting for
      # each to reach the index before its dependents. Skips publish = false
      # crates (cyanea-py, cyanea-wasm, benchmarks).
      #
      # crates.io versions are immutable and `cargo publish` errors (rather than
      # skipping) if a version already exists. A prior tag run can publish some
      # members before failing partway, so query crates.io and --exclude any
      # member already at this version, letting the publish resume from where it
      # stopped. On a clean release nothing is excluded and the full workspace
      # publishes.
      - name: Publish workspace (resume-safe)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"

          excludes=()
          for name in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish != []) | .name'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: cyanea-labs-release (ci@cyanea.bio)' \
              "https://crates.io/api/v1/crates/${name}/${VERSION}")
            if [ "$code" = "200" ]; then
              echo "already on crates.io, skipping: ${name}@${VERSION}"
              excludes+=(--exclude "${name}")
            fi
          done

          echo "publishing v${VERSION} ${excludes[*]:-(full workspace)}"
          cargo publish --workspace ${excludes[@]+"${excludes[@]}"}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
