name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # cyanea-py (PyO3) builds against the abi3 stable ABI; allow a host Python
  # newer than PyO3's max supported version (e.g. macOS runners ship 3.14).
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  check:
    name: Check (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude cyanea-py

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - cyanea-core
          - cyanea-seq
          - cyanea-align
          - cyanea-omics
          - cyanea-stats
          - cyanea-ml
          - cyanea-chem
          - cyanea-struct
          - cyanea-phylo
          - cyanea-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries (HDF5 for cyanea-omics h5ad feature)
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: No default features
        run: cargo check -p ${{ matrix.crate }} --no-default-features
      - name: All features
        # cyanea-gpu / cyanea-align expose GPU backends (metal = Apple-only
        # frameworks, cuda = needs a CUDA toolkit) via --all-features that
        # cannot build on a generic Linux runner. Their minimal build is still
        # covered by the --no-default-features step above.
        if: matrix.crate != 'cyanea-gpu' && matrix.crate != 'cyanea-align'
        run: cargo check -p ${{ matrix.crate }} --all-features

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cyanea-wasm --target wasm32-unknown-unknown --features wasm

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p cyanea-py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Gates CI. The workspace-wide allow-list (needless_range_loop,
      # too_many_arguments, type_complexity — pedantic in numerical code) lives
      # in the root Cargo.toml under [workspace.lints.clippy]; everything else
      # must be clean.
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
