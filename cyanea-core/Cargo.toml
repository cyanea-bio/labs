[package]
name = "cyanea-core"
description = "Shared primitives, traits, and utilities for the Cyanea bioinformatics ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["bioinformatics", "genomics", "biology", "science", "comp-bio"]
categories = ["science"]

[features]
default = ["std"]
# Compression and memory mapping, plus everything in `io`.
std = ["io", "memmap2", "zstd", "flate2"]
# The standard library: `CyaneaError::Io` and `hash::sha256_file`. Without
# `io` (and so without `std`) the crate is `no_std` + `alloc`.
io = ["thiserror/std", "sha2/std", "hex/std"]
wasm = []
serde = ["dep:serde"]

[dependencies]
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
libm = { workspace = true }
serde = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
